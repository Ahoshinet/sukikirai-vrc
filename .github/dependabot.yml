version: 2
updates:
  # Enable version updates for npm
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 10
    reviewers:
      - "darui3018823"
    assignees:
      - "darui3018823"
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"
    # Group all npm updates into one PR
    groups:
      dependencies:
        patterns:
          - "*"
    ignore:
      # eslint-config-next bundles eslint-plugin-react, which crashes on ESLint 10.
      - dependency-name: "eslint"
        versions: [">= 10"]
      # "typescript" is aliased to @typescript/typescript6 so that typescript-eslint
      # keeps a 6.0 compiler API to import; it refuses to load under TS 7.0 and
      # support is planned for TS 7.1. The real TypeScript 7 compiler is installed
      # as "@typescript/native" and provides tsc.
      # https://github.com/typescript-eslint/typescript-eslint/issues/10940
      - dependency-name: "typescript"
        versions: [">= 7"]

  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    reviewers:
      - "darui3018823"
    assignees:
      - "darui3018823"
    commit-message:
      prefix: "ci"
      include: "scope"
    # Group all action updates into one PR
    groups:
      actions:
        patterns:
          - "*"
