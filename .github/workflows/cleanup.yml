name: Cleanup

on:
  schedule:
    - cron: '0 18 * * 0'
  workflow_dispatch:

jobs:
  logs:
    name: Delete expired action logs
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Delete action logs older than 6 months
        run: >
          pnpm exec wrangler d1 execute sukikiraivrc --remote --yes
          --command "DELETE FROM action_logs WHERE created_at < unixepoch('now', '-6 months');"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
