name: Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    environment: production
    env:
      APP_DIR: /opt/sukikiraivrc

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Assemble release
        run: |
          set -euo pipefail
          out=.next/standalone
          cp -r .next/static "$out/.next/static"
          if [ -d public ]; then cp -r public "$out/public"; fi
          rm -rf "$out/drizzle" "$out/scripts"
          cp -r drizzle "$out/drizzle"
          cp -r scripts "$out/scripts"
          # ビルド時に作られた空の SQLite は持ち込まない
          rm -rf "$out/data"

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Upload release
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -p $VPS_PORT" \
            .next/standalone/ \
            "$VPS_USER@$VPS_HOST:$APP_DIR/releases/$GITHUB_SHA/"

      - name: Activate release
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "APP_DIR=$APP_DIR RELEASE=$GITHUB_SHA bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$APP_DIR"
          previous=$(readlink -f current || true)
          ln -sfn "releases/$RELEASE" current.tmp
          mv -Tf current.tmp current
          sudo systemctl restart sukikiraivrc

          # 起動時にマイグレーションが走るので、応答が返るまで待つ
          for _ in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:3000/robots.txt; then
              ok=1
              break
            fi
            sleep 2
          done

          if [ "${ok:-}" != 1 ]; then
            echo "health check failed" >&2
            sudo journalctl -u sukikiraivrc -n 50 --no-pager >&2 || true
            if [ -n "$previous" ] && [ "$previous" != "$(readlink -f current)" ]; then
              ln -sfn "$previous" current.tmp
              mv -Tf current.tmp current
              sudo systemctl restart sukikiraivrc
              echo "rolled back to $previous" >&2
            fi
            exit 1
          fi

          # 直近 5 リリースだけ残す
          ls -1dt releases/*/ | tail -n +6 | xargs -r rm -rf
          REMOTE
