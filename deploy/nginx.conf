# /etc/nginx/sites-available/sukikiraivrc
#
# 前段に Cloudflare プロキシを置く前提（CLIENT_IP_HEADER=cf-connecting-ip）。
# オリジンへの直アクセスで cf-connecting-ip を偽装されないよう、ファイアウォールで
# 443 を Cloudflare の IP 帯（https://www.cloudflare.com/ips/）だけに絞ること。
#
# Cloudflare を使わず直受けする場合は CLIENT_IP_HEADER=x-real-ip にし、
# 下の X-Real-IP 行で必ずクライアントの値を上書きする。

server {
    listen 80;
    listen [::]:80;
    server_name sukikiraivrc.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name sukikiraivrc.com;

    # Cloudflare Origin Certificate もしくは certbot で発行した証明書
    ssl_certificate     /etc/ssl/sukikiraivrc/cert.pem;
    ssl_certificate_key /etc/ssl/sukikiraivrc/key.pem;

    client_max_body_size 1m;

    location /_next/static/ {
        alias /opt/sukikiraivrc/current/.next/static/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
